<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCADE GAME | TAHIR NAZEER GAME</title>
    
    <!-- Game Icon -->
    <link rel="icon" type="image/png" href="./tn-game-icon.png">
    
    <!-- Existing System CSS -->
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./brand.css">

    <style>
        :root {
            --bg-dark: #020205;
            --card-bg: rgba(10, 10, 25, 0.9);
            --primary-gold: #ffd700;
            --accent-cyan: #00f0ff;
            --accent-purple: #8a2be2;
            --accent-neon: #ff0055;
            --text-light: #ffffff;
            --border-glow: rgba(0, 240, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, #08081c 0%, #000000 100%);
            overflow-x: hidden;
        }

        /* Top Header Navigation */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-glow);
            backdrop-filter: blur(15px);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 2px solid var(--primary-gold);
            box-shadow: 0 0 10px var(--primary-gold);
        }

        .brand-text h1 {
            font-size: 1.1rem;
            color: var(--primary-gold);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .brand-text span {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            font-weight: bold;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-nav {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glow);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-nav:hover {
            border-color: var(--primary-gold);
            color: var(--primary-gold);
        }

        .creator-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-gold);
        }

        /* Main Game Arena Container */
        .game-container {
            max-width: 1000px;
            margin: 15px auto;
            width: 100%;
            padding: 0 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex: 1;
        }

        /* Score Dashboard Bar */
        .dashboard-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
        }

        .dash-item {
            text-align: center;
        }

        .dash-label {
            font-size: 0.75rem;
            color: #aaa;
            letter-spacing: 1px;
        }

        .dash-value {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--primary-gold);
            text-shadow: 0 0 10px var(--primary-gold);
        }

        /* Canvas Arena Frame */
        .canvas-frame {
            position: relative;
            width: 100%;
            height: 480px;
            background: #000;
            border-radius: 20px;
            border: 2px solid var(--border-glow);
            box-shadow: 0 0 35px rgba(138, 43, 226, 0.3);
            overflow: hidden;
            touch-action: none;
        }

        #arcadeCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Game Watermark Overlay */
        .arena-watermark {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.6;
            pointer-events: none;
        }

        .arena-watermark img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid var(--primary-gold);
        }

        .arena-watermark span {
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--primary-gold);
            letter-spacing: 1px;
        }

        /* Mobile Touch Controls */
        .mobile-controls {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 5px;
        }

        .btn-control {
            flex: 1;
            padding: 16px;
            background: linear-gradient(180deg, rgba(0, 240, 255, 0.2), rgba(138, 43, 226, 0.3));
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            text-align: center;
        }

        .btn-control:active {
            background: var(--accent-neon);
            box-shadow: 0 0 25px var(--accent-neon);
        }

        @media (max-width: 768px) {
            .canvas-frame { height: 380px; }
            .dashboard-bar { padding: 10px 15px; }
            .dash-value { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation Bar -->
    <header class="game-header">
        <div class="brand-box">
            <img src="./tn-game-icon.png" alt="TN Icon" class="brand-icon">
            <div class="brand-text">
                <h1>MALIK TAHIR NAZEER</h1>
                <span>TN ARCADE ENGINE</span>
            </div>
        </div>

        <div class="nav-actions">
            <a href="./index.html" class="btn-nav">🏠 HOME</a>
            <a href="./community.html" class="btn-nav">🪙 REWARDS</a>
            <img src="./profile.jpg" alt="Tahir Nazeer" class="creator-avatar">
        </div>
    </header>

    <!-- Game Arena Container -->
    <div class="game-container">
        
        <!-- Score Dashboard -->
        <div class="dashboard-bar">
            <div class="dash-item">
                <div class="dash-label">PLAYER</div>
                <div class="dash-value" id="playerNameDisplay">Gamer</div>
            </div>
            <div class="dash-item">
                <div class="dash-label">SCORE</div>
                <div class="dash-value" id="gameScore">0</div>
            </div>
            <div class="dash-item">
                <div class="dash-label">TN COINS</div>
                <div class="dash-value" id="tnCoinsEarned">0</div>
            </div>
        </div>

        <!-- Canvas Arcade Arena -->
        <div class="canvas-frame" id="canvasFrame">
            <canvas id="arcadeCanvas"></canvas>
            
            <div class="arena-watermark">
                <img src="./profile.jpg" alt="TN Boss">
                <span>TAHIR NAZEER GAME</span>
            </div>
        </div>

        <!-- Mobile Touch Controls -->
        <div class="mobile-controls">
            <button class="btn-control" id="btnLeft">◀ LEFT</button>
            <button class="btn-control" id="btnRight">RIGHT ▶</button>
        </div>

    </div>

    <!-- Existing JS System Libraries -->
    <script src="./brand.js"></script>
    <script src="./gameEngine.js"></script>
    <script src="./gameLoop.js"></script>
    <script src="./gameControls.js"></script>

    <script>
        const canvas = document.getElementById('arcadeCanvas');
        const ctx = canvas.getContext('2d');
        const frame = document.getElementById('canvasFrame');

        let score = 0;
        let coinsEarned = 0;
        let animationFrameId;

        // Player Spacecraft / Character
        let player = {
            x: 0,
            y: 0,
            width: 50,
            height: 50,
            speed: 7,
            dx: 0
        };

        // Falling Coin Targets
        let coins = [];

        function initCanvasSize() {
            canvas.width = frame.clientWidth;
            canvas.height = frame.clientHeight;
            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - player.height - 20;
        }

        window.addEventListener('load', () => {
            initCanvasSize();
            const playerName = localStorage.getItem('tn_player_name') || 'Malik Tahir Nazeer';
            document.getElementById('playerNameDisplay').innerText = playerName;
            gameLoop();
        });

        window.addEventListener('resize', initCanvasSize);

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') player.dx = -player.speed;
            if (e.key === 'ArrowRight' || e.key === 'd') player.dx = player.speed;
        });

        window.addEventListener('keyup', (e) => {
            if (['ArrowLeft', 'ArrowRight', 'a', 'd'].includes(e.key)) player.dx = 0;
        });

        // Mobile Controls Listeners
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');

        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); player.dx = -player.speed; });
        btnLeft.addEventListener('touchend', () => { player.dx = 0; });

        btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); player.dx = player.speed; });
        btnRight.addEventListener('touchend', () => { player.dx = 0; });

        btnLeft.addEventListener('mousedown', () => { player.dx = -player.speed; });
        btnLeft.addEventListener('mouseup', () => { player.dx = 0; });

        btnRight.addEventListener('mousedown', () => { player.dx = player.speed; });
        btnRight.addEventListener('mouseup', () => { player.dx = 0; });

        // Spawn Target Coins
        function spawnCoin() {
            if (Math.random() < 0.04) {
                coins.push({
                    x: Math.random() * (canvas.width - 30),
                    y: -30,
                    size: 25,
                    speed: 3 + Math.random() * 3
                });
            }
        }

        // Main Game Loop Engine
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Move Player
            player.x += player.dx;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Draw Neon Player (Tahir Nazeer Ship)
            ctx.fillStyle = '#00f0ff';
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 15;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Spawn and Render Coins
            spawnCoin();

            for (let i = coins.length - 1; i >= 0; i--) {
                let c = coins[i];
                c.y += c.speed;

                // Draw Golden Coins
                ctx.fillStyle = '#ffd700';
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size / 2, 0, Math.PI * 2);
                ctx.fill();

                // Collision Detection with Player
                if (
                    c.x > player.x &&
                    c.x < player.x + player.width &&
                    c.y > player.y &&
                    c.y < player.y + player.height
                ) {
                    coins.splice(i, 1);
                    score += 10;
                    coinsEarned += 1;

                    document.getElementById('gameScore').innerText = score;
                    document.getElementById('tnCoinsEarned').innerText = coinsEarned;

                    // Update Global TN Coin Balance
                    let totalCoins = parseInt(localStorage.getItem('tn_coins') || '1250') + 1;
                    localStorage.setItem('tn_coins', totalCoins);
                } else if (c.y > canvas.height) {
                    coins.splice(i, 1);
                }
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
