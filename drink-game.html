<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D ULTIMATE CLASSIC DRINK GAME | TAHIR NAZEER</title>
    
    <link rel="icon" type="image/png" href="./tn-game-icon.png">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./brand.css">

    <style>
        :root {
            --bg-dark: #020208;
            --card-glass: rgba(12, 12, 30, 0.85);
            --primary-gold: #ffd700;
            --accent-cyan: #00f0ff;
            --accent-purple: #8a2be2;
            --accent-neon: #ff0055;
            --border-glow: rgba(0, 240, 255, 0.6);
            --liquid-color: #ff0055;
            --wave-speed: 2s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, #0d0d26 0%, #010103 100%);
            overflow-x: hidden;
        }

        .drink-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-glass);
            padding: 14px 24px;
            border-bottom: 2px solid transparent;
            border-image: linear-gradient(90deg, var(--accent-neon), var(--primary-gold), var(--accent-cyan)) 1;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.25);
            z-index: 100;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--primary-gold);
            box-shadow: 0 0 15px var(--primary-gold);
            object-fit: cover;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(180deg, #fff, var(--primary-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .brand-sub {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-btns {
            display: flex;
            gap: 10px;
        }

        .btn-nav-3d {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            color: #fff;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .btn-nav-3d:hover {
            border-color: var(--primary-gold);
            color: var(--primary-gold);
            box-shadow: 0 0 15px var(--primary-gold);
        }

        .drink-container {
            max-width: 1200px;
            margin: 20px auto;
            width: 100%;
            padding: 0 15px;
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
            flex: 1;
        }

        .drink-panel {
            background: var(--card-glass);
            border: 2px solid var(--border-glow);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.25), inset 0 0 15px rgba(0, 240, 255, 0.15);
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 85vh;
            overflow-y: auto;
            z-index: 50;
        }

        .panel-heading {
            font-size: 1rem;
            color: var(--primary-gold);
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            padding-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .flavor-selector {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-flavor {
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .btn-flavor:hover, .btn-flavor.active {
            border-color: var(--primary-gold);
            box-shadow: 0 0 15px var(--border-glow);
            transform: translateX(4px);
        }

        .flavor-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }

        .glass-stage {
            background: var(--card-glass);
            border: 2px solid var(--border-glow);
            border-radius: 24px;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.2);
            min-height: 520px;
            overflow: hidden;
        }

        .drink-cup-wrapper {
            position: relative;
            width: 180px;
            height: 320px;
            border: 4px solid rgba(255, 255, 255, 0.4);
            border-top: none;
            border-radius: 0 0 40px 40px;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.15), inset 0 0 20px rgba(255, 255, 255, 0.2);
            overflow: hidden;
            backdrop-filter: blur(5px);
            z-index: 5;
            transition: border-radius 0.5s ease;
        }

        .liquid-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60%;
            background: var(--liquid-color);
            box-shadow: 0 0 35px var(--liquid-color);
            transition: height 0.5s ease, background-color 0.5s ease;
        }

        .liquid-fill::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 0;
            width: 100%;
            height: 20px;
            background: var(--liquid-color);
            border-radius: 50%;
            opacity: 0.8;
            animation: wave var(--wave-speed) infinite ease-in-out;
        }

        .drink-straw {
            position: absolute;
            top: -40px;
            right: 40px;
            width: 16px;
            height: 300px;
            background: repeating-linear-gradient(45deg, #fff, #fff 10px, var(--accent-neon) 10px, var(--accent-neon) 20px);
            transform: rotate(12deg);
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            z-index: 6;
        }

        .drawing-canvas-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none; /* زبان اور بٹنز کو بلاک نہ کرے */
        }

        .drawing-canvas-overlay.active-mode {
            pointer-events: auto; /* صرف ڈرائنگ کے وقت ایکٹیو ہو */
        }

        .controls-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
            z-index: 30;
        }

        .btn-fill-action {
            padding: 12px 24px;
            background: linear-gradient(90deg, var(--accent-neon), var(--accent-purple), var(--accent-cyan));
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--accent-neon);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-fill-action:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px var(--accent-cyan);
        }

        .btn-fill-action:active {
            transform: scale(0.95);
        }

        .brush-selector-grid, .extra-tools-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .btn-tool-sm {
            padding: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn-tool-sm.active, .btn-tool-sm:hover {
            border-color: var(--primary-gold);
            background: rgba(255, 215, 0, 0.25);
            color: var(--primary-gold);
        }

        .drink-watermark {
            position: absolute;
            bottom: 15px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.8;
            z-index: 30;
        }

        .drink-watermark img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--primary-gold);
        }

        .drink-watermark span {
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--primary-gold);
            letter-spacing: 1px;
        }

        @keyframes wave {
            0%, 100% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(-6px) scaleY(1.25); }
        }

        @media (max-width: 768px) {
            .drink-container { grid-template-columns: 1fr; }
            .drink-cup-wrapper { width: 140px; height: 260px; }
        }
    </style>
</head>
<body>

    <header class="drink-header">
        <div class="brand-box">
            <img src="./profile.jpg" alt="Mr. Tahir Nazeer" class="brand-avatar">
            <div>
                <div class="brand-title">MALIK TAHIR NAZEER</div>
                <div class="brand-sub">3D CLASSIC DRINK SIMULATOR</div>
            </div>
        </div>

        <div class="nav-btns">
            <a href="./index.html" class="btn-nav-3d">🏠 HOME</a>
            <a href="./game.html" class="btn-nav-3d">🎮 ARCADE</a>
        </div>

    <div class="drink-container">
        
        <div class="drink-panel">
            
            <div class="panel-heading">
                <span>🍹 SELECT FLAVOR (100+ READY)</span>
            </div>

            <div class="flavor-selector" id="flavorList">
                <!-- پہلے والے اصلی ذائقے -->

                    <span>🍓 Neon Strawberry</span>

                <button class="btn-flavor" onclick="changeFlavor('#00f0ff', 'Cyan Blue Blast', event)">
                    <span>🧊 Cyan Blue Blast</span>
                    <span class="flavor-dot" style="background: #00f0ff; color: #00f0ff;"></span>
                </button>
                <button class="btn-flavor" onclick="changeFlavor('#ffd700', 'Golden Mango Glow', event)">
                    <span>🥭 Golden Mango Glow</span>
                    <span class="flavor-dot" style="background: #ffd700; color: #ffd700;"></span>

                <button class="btn-flavor" onclick="changeFlavor('#00ff66', 'Lime Electric', event)">

                <button class="btn-flavor" onclick="changeFlavor('#8a2be2', 'Purple Grape Fusion', event)">
                    <span>🍇 Purple Grape Fusion</span>
                    <span class="flavor-dot" style="background: #8a2be2; color: #8a2be2;"></span>
                </button>
                <button class="btn-flavor" onclick="changeFlavor('#ff00ff', 'Pink Bubblegum', event)">
                    <span>🍬 Pink Bubblegum</span>
                    <span class="flavor-dot" style="background: #ff00ff; color: #ff00ff;"></span>
                </button>
                <button class="btn-flavor" onclick="changeFlavor('#ffffff', 'Coconut Milkshake', event)">
                    <span>🥥 Coconut Milkshake</span>
                    <span class="flavor-dot" style="background: #ffffff; color: #ffffff;"></span>

                <button class="btn-flavor" onclick="changeFlavor('#4a2c11', 'Classic Cola Shake', event)">
                    <span>🥤 Classic Cola Shake</span>

            <button class="btn-tool-sm" onclick="loadMoreFlavors()" style="width:100%; padding:10px; margin-top:5px; background:var(--accent-purple);">
                ⚡ LOAD 20+ NEW MODERN DRINKS
            </button>

            <div class="panel-heading">
                <span>🥤 GLASS STYLE & WAVES</span>
            </div>
            <div class="brush-selector-grid">
                <button class="btn-tool-sm" onclick="setGlassStyle('classic')">🥛 Classic</button>
                <button class="btn-tool-sm" onclick="setGlassStyle('rounded')">🧪 Round</button>
                <button class="btn-tool-sm" onclick="setGlassStyle('square')">🧊 Square</button>

            <div class="brush-selector-grid" style="margin-top:5px;">
                <button class="btn-tool-sm" onclick="setWaveSpeed('1s')">⚡ Fast Wave</button>
                <button class="btn-tool-sm" onclick="setWaveSpeed('2s')">🌊 Normal</button>
                <button class="btn-tool-sm" onclick="setWaveSpeed('4s')">🍃 Smooth</button>

            <div class="panel-heading">

            <button class="btn-tool-sm" id="toggleDrawBtn" onclick="toggleDrawingMode()" style="width:100%; padding:10px; background:rgba(0,240,255,0.2);">
                ✏️ ENABLE ART DRAWING
            </button>
            
            <div class="brush-selector-grid" style="margin-top:8px;">
                <button class="btn-tool-sm active" onclick="setBrushMode('pencil', event)">✏️ Pencil</button>
                <button class="btn-tool-sm" onclick="setBrushMode('neon', event)">🌟 Neon</button>
                <button class="btn-tool-sm" onclick="setBrushMode('spray', event)">💨 Spray</button>
                <button class="btn-tool-sm" onclick="setBrushMode('rainbow', event)">🌈 Rainbow</button>

            <input type="color" id="customColorPicker" value="#00f0ff" onchange="setCustomColor(this.value)" style="width:100%; height:35px; border-radius:8px; border:none; cursor:pointer; background:transparent;">

            <div class="panel-heading">
                <span>🦁 STICKERS & EMBLEMS</span>
            </div>
            <div class="extra-tools-grid">
                <button class="btn-tool-sm" onclick="addSticker('🦁')">🦁 Lion</button>
                <button class="btn-tool-sm" onclick="addSticker('👑')">👑 Crown</button>
                <button class="btn-tool-sm" onclick="addSticker('🦅')">🦅 Eagle</button>
                <button class="btn-tool-sm" onclick="addSticker('🔥')">🔥 Fire</button>
                <button class="btn-tool-sm" onclick="addSticker('💎')">💎 Diamond</button>
                <button class="btn-tool-sm" onclick="addSticker('⚡')">⚡ Lightning</button>
            </div>
        </div>

        <div class="glass-stage">
            
            <div class="drink-cup-wrapper" id="cupWrapper">
                <div class="drink-straw"></div>
                <div class="liquid-fill" id="liquidFill"></div>
            </div>

            <!-- Drawing Layer -->
            <canvas id="drawingCanvas" class="drawing-canvas-overlay"></canvas>

            <div class="controls-row">
                <button class="btn-fill-action" onclick="pourDrink()">
                    🥤 POUR / REFILL DRINK
                </button>
                <button class="btn-fill-action" style="background: linear-gradient(90deg, #ff0055, #ff6600);" onclick="clearDrawingCanvas()">
                    🗑️ CLEAR ART
                </button>
                <button class="btn-fill-action" style="background: linear-gradient(90deg, #00ff66, #00f0ff);" onclick="downloadArtWithWatermark()">
                    💾 SAVE CREATION
                </button>
            </div>

            <div class="drink-watermark">
                <img src="./profile.jpg" alt="TN Boss">
                <span>MR. TAHIR NAZEER DRINK GAME</span>
            </div>
        </div>

    </div>

    <script src="./brand.js"></script>
    <script src="./drinkEngine.js"></script>
    <script src="./liquidPhysics.js"></script>

    <script>
        let currentFillPercent = 60;
        let drawingModeEnabled = false;

        // پہلے والے تمام ذائقے اور Pouring کا فنکشن 100% ورکنگ
        function changeFlavor(color, name, evt) {
            const liquid = document.getElementById('liquidFill');
            liquid.style.backgroundColor = color;
            liquid.style.boxShadow = `0 0 35px ${color}`;
            
            document.querySelectorAll('#flavorList .btn-flavor').forEach(btn => btn.classList.remove('active'));
            if(evt && evt.currentTarget) {
                evt.currentTarget.classList.add('active');
            }
        }

        function pourDrink() {
            const liquid = document.getElementById('liquidFill');
            if (currentFillPercent >= 90) {
                currentFillPercent = 20;
            } else {
                currentFillPercent += 20;
            }
            liquid.style.height = `${currentFillPercent}%`;
        }

        // سینکڑوں مزید جدید ڈرنکس لوڈ کرنے کا سسٹم
        const extraModernDrinks = [
            { name: "⚡ Neon Energy Mix", color: "#ccff00", emoji: "⚡" },
            { name: "🌌 Galaxy Blueberry", color: "#330066", emoji: "🌌" },
            { name: "🍒 Cyber Cherry", color: "#ff0033", emoji: "🍒" },
            { name: "🥝 Tropical Kiwi", color: "#66ff33", emoji: "🥝" },
            { name: "🍌 Golden Banana Smoothie", color: "#ffe600", emoji: "🍌" },
            { name: "🍫 Dark Chocolate Mocha", color: "#3d2314", emoji: "🍫" },
            { name: "🍉 Fresh Watermelon Glow", color: "#ff3366", emoji: "🍉" },
            { name: "🍑 Peach Sunrise", color: "#ff9966", emoji: "🍑" }
        ];

        function loadMoreFlavors() {
            const container = document.getElementById('flavorList');
            extraModernDrinks.forEach(d => {
                const btn = document.createElement('button');
                btn.className = 'btn-flavor';
                btn.onclick = (e) => changeFlavor(d.color, d.name, e);
                btn.innerHTML = `<span>${d.emoji} ${d.name}</span><span class="flavor-dot" style="background: ${d.color}; color: ${d.color};"></span>`;
                container.appendChild(btn);
            });
            alert('🚀 20+ New Modern Drinks added to your menu!');
        }

        function setGlassStyle(style) {
            const cup = document.getElementById('cupWrapper');
            if (style === 'classic') cup.style.borderRadius = "0 0 40px 40px";
            if (style === 'rounded') cup.style.borderRadius = "0 0 90px 90px";
            if (style === 'square') cup.style.borderRadius = "0 0 10px 10px";
        }

        function setWaveSpeed(speed) {
            document.documentElement.style.setProperty('--wave-speed', speed);
        }

        // Drawing Overlay Management (بٹن کو بلاک نہ کرنے کا حل)
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentBrushMode = 'pencil';
        let currentBrushColor = '#00f0ff';
        let currentBrushWidth = 5;

        function toggleDrawingMode() {
            drawingModeEnabled = !drawingModeEnabled;
            const btn = document.getElementById('toggleDrawBtn');
            if(drawingModeEnabled) {
                canvas.classList.add('active-mode');
                btn.style.background = 'var(--primary-gold)';
                btn.style.color = '#000';
                btn.innerText = '✅ ART MODE ACTIVE (DRAW NOW)';
            } else {
                canvas.classList.remove('active-mode');
                btn.style.background = 'rgba(0,240,255,0.2)';
                btn.style.color = '#fff';
                btn.innerText = '✏️ ENABLE ART DRAWING';
            }
        }

        function resizeCanvas() {
            const stage = document.querySelector('.glass-stage');
            canvas.width = stage.clientWidth;
            canvas.height = stage.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 200);

        function setBrushMode(mode, evt) {
            currentBrushMode = mode;
            if (!drawingModeEnabled) toggleDrawingMode();
            document.querySelectorAll('.brush-selector-grid .btn-tool-sm').forEach(btn => btn.classList.remove('active'));
            if(evt && evt.currentTarget) evt.currentTarget.classList.add('active');
        }

        function setCustomColor(color) { currentBrushColor = color; }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            let cx = e.clientX || (e.touches && e.touches[0].clientX);
            let cy = e.clientY || (e.touches && e.touches[0].clientY);
            return { x: cx - rect.left, y: cy - rect.top };
        }

        function startDrawing(e) {
            if (!drawingModeEnabled) return;
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            draw(e);
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!isDrawing || !drawingModeEnabled) return;
            e.preventDefault();
            const pos = getPos(e);

            ctx.lineWidth = currentBrushWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (currentBrushMode === 'pencil') {
                ctx.strokeStyle = currentBrushColor;
                ctx.shadowBlur = 0;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (currentBrushMode === 'neon') {
                ctx.strokeStyle = currentBrushColor;
                ctx.shadowColor = currentBrushColor;
                ctx.shadowBlur = 15;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (currentBrushMode === 'spray') {
                ctx.shadowBlur = 0;
                for (let i = 0; i < 15; i++) {
                    const offsetX = (Math.random() - 0.5) * 20;
                    const offsetY = (Math.random() - 0.5) * 20;
                    ctx.fillStyle = currentBrushColor;
                    ctx.fillRect(pos.x + offsetX, pos.y + offsetY, 2, 2);
                }
            } else if (currentBrushMode === 'rainbow') {
                const hue = (Date.now() / 10) % 360;
                ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`;
                ctx.shadowBlur = 5;
                ctx.shadowColor = ctx.strokeStyle;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (currentBrushMode === 'stars') {
                ctx.font = '20px Arial';
                ctx.fillText('✨', pos.x, pos.y);
            } else if (currentBrushMode === 'gold') {
                ctx.strokeStyle = '#ffd700';
                ctx.shadowColor = '#ffae00';
                ctx.shadowBlur = 12;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            }
        }

        function addSticker(emoji) {
            if (!drawingModeEnabled) toggleDrawingMode();
            ctx.font = '45px Arial';
            ctx.fillText(emoji, canvas.width / 2 - 20, canvas.height / 2);
        }

        function clearDrawingCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function downloadArtWithWatermark() {
            ctx.font = '900 16px Segoe UI, sans-serif';
            ctx.fillStyle = '#ffd700';
            ctx.fillText('CREATED BY: MALIK TAHIR NAZEER', 20, canvas.height - 20);

            const link = document.createElement('a');
            link.download = 'tahir-nazeer-drink-art.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);
    </script>
</body>
</html>
