<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D CLASSIC DRINK GAME | TAHIR NAZEER</title>
    
    <!-- Game Icon & Favicon -->
    <link rel="icon" type="image/png" href="./tn-game-icon.png">
    
    <!-- Existing CSS System -->
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./brand.css">

    <style>
        :root {
            --bg-dark: #020208;
            --card-glass: rgba(12, 12, 30, 0.75);
            --primary-gold: #ffd700;
            --accent-cyan: #00f0ff;
            --accent-purple: #8a2be2;
            --accent-neon: #ff0055;
            --border-glow: rgba(0, 240, 255, 0.6);
            --liquid-color: #ff0055;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, #0d0d26 0%, #010103 100%);
            overflow-x: hidden;
        }

        /* 3D Animated Border Header */
        .drink-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-glass);
            padding: 14px 24px;
            border-bottom: 2px solid transparent;
            border-image: linear-gradient(90deg, var(--accent-neon), var(--primary-gold), var(--accent-cyan)) 1;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.25);
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--primary-gold);
            box-shadow: 0 0 15px var(--primary-gold);
            object-fit: cover;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(180deg, #fff, var(--primary-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .brand-sub {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-btns {
            display: flex;
            gap: 10px;
        }

        .btn-nav-3d {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glow);
            color: #fff;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .btn-nav-3d:hover {
            border-color: var(--primary-gold);
            color: var(--primary-gold);
            box-shadow: 0 0 15px var(--primary-gold);
        }

        /* Main Game Arena */
        .drink-container {
            max-width: 1100px;
            margin: 20px auto;
            width: 100%;
            padding: 0 15px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            flex: 1;
        }

        /* Movie-Style Controls Side Panel */
        .drink-panel {
            background: var(--card-glass);
            border: 2px solid var(--border-glow);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.25), inset 0 0 15px rgba(0, 240, 255, 0.15);
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .panel-heading {
            font-size: 1.1rem;
            color: var(--primary-gold);
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .flavor-selector {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-flavor {
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .btn-flavor:hover, .btn-flavor.active {
            border-color: var(--primary-gold);
            box-shadow: 0 0 15px var(--border-glow);
            transform: translateX(5px);
        }

        .flavor-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }

        /* 3D Glass Drink Display Area */
        .glass-stage {
            background: var(--card-glass);
            border: 2px solid var(--border-glow);
            border-radius: 24px;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.2);
            min-height: 480px;
            overflow: hidden;
        }

        /* 3D Drink Cup Graphics */
        .drink-cup-wrapper {
            position: relative;
            width: 180px;
            height: 320px;
            border: 4px solid rgba(255, 255, 255, 0.4);
            border-top: none;
            border-radius: 0 0 40px 40px;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.15), inset 0 0 20px rgba(255, 255, 255, 0.2);
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        .liquid-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60%;
            background: var(--liquid-color);
            box-shadow: 0 0 30px var(--liquid-color);
            transition: height 0.5s ease, background-color 0.5s ease;
        }

        /* Liquid Wave Motion */
        .liquid-fill::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 0;
            width: 100%;
            height: 20px;
            background: var(--liquid-color);
            border-radius: 50%;
            opacity: 0.8;
            animation: wave 2s infinite ease-in-out;
        }

        .drink-straw {
            position: absolute;
            top: -40px;
            right: 40px;
            width: 16px;
            height: 300px;
            background: repeating-linear-gradient(45deg, #fff, #fff 10px, var(--accent-neon) 10px, var(--accent-neon) 20px);
            transform: rotate(12deg);
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            z-index: 2;
        }

        .drink-watermark {
            position: absolute;
            bottom: 15px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.7;
        }

        .drink-watermark img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--primary-gold);
        }

        .drink-watermark span {
            font-size: 0.85rem;
            font-weight: 900;
            color: var(--primary-gold);
            letter-spacing: 1px;
        }

        .btn-fill-action {
            margin-top: 20px;
            padding: 14px 28px;
            background: linear-gradient(90deg, var(--accent-neon), var(--accent-purple), var(--accent-cyan));
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 0 25px var(--accent-neon);
            transition: transform 0.2s ease;
        }

        .btn-fill-action:active {
            transform: scale(0.95);
        }

        @keyframes wave {
            0%, 100% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(-5px) scaleY(1.2); }
        }

        @media (max-width: 768px) {
            .drink-container { grid-template-columns: 1fr; }
            .drink-cup-wrapper { width: 140px; height: 260px; }
        }

        /* ------------------ ADDITIONAL STYLES ------------------ */
        .extra-tools-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .brush-selector-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .btn-tool-sm {
            padding: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: center;
        }

        .btn-tool-sm.active, .btn-tool-sm:hover {
            border-color: var(--primary-gold);
            background: rgba(255, 215, 0, 0.2);
        }

        .drawing-canvas-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: crosshair;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
            z-index: 12;
        }

        .watermark-overlay-export {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: var(--primary-gold);
            font-size: 0.8rem;
            font-weight: 900;
            pointer-events: none;
            z-index: 15;
            background: rgba(0,0,0,0.6);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--primary-gold);
        }
    </style>
</head>

    <!-- Existing System Scripts -->

    <script>
        let currentFillPercent = 60;

        function changeFlavor(color, name) {
            const liquid = document.getElementById('liquidFill');
            liquid.style.backgroundColor = color;
            liquid.style.boxShadow = `0 0 35px ${color}`;
            
            document.querySelectorAll('.btn-flavor').forEach(btn => btn.classList.remove('active'));
            if(event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }
        }

        function pourDrink() {
            const liquid = document.getElementById('liquidFill');
            if (currentFillPercent >= 90) {
                currentFillPercent = 20;
            } else {
                currentFillPercent += 25;
            }
            liquid.style.height = `${currentFillPercent}%`;
        }

        function addIceCubes() {
            alert('🧊 3D Ice Cubes added into Mr. Tahir Nazeer Drink Cup!');
        }

        /* ------------------ ADDITIONAL DRAWING ENGINE & CANVAS LOGIC ------------------ */
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentBrushMode = 'pencil';
        let currentBrushColor = '#00f0ff';
        let currentBrushWidth = 5;

        function resizeCanvas() {
            const stage = document.querySelector('.glass-stage');
            canvas.width = stage.clientWidth;
            canvas.height = stage.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 200);

        function setBrushMode(mode) {
            currentBrushMode = mode;
            document.querySelectorAll('.btn-tool-sm').forEach(btn => btn.classList.remove('active'));
            if(event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }
        }

        function setCustomColor(color) {
            currentBrushColor = color;
        }

        function updateBrushSize(size) {
            currentBrushWidth = size;
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            let cx = e.clientX;
            let cy = e.clientY;
            if(e.touches && e.touches[0]){
                cx = e.touches[0].clientX;
                cy = e.touches[0].clientY;
            }
            return {
                x: cx - rect.left,
                y: cy - rect.top
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            draw(e);
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPos(e);

            ctx.lineWidth = currentBrushWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (currentBrushMode === 'pencil') {
                ctx.strokeStyle = currentBrushColor;
                ctx.shadowBlur = 0;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (currentBrushMode === 'neon') {
                ctx.strokeStyle = currentBrushColor;
                ctx.shadowColor = currentBrushColor;
                ctx.shadowBlur = 15;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (currentBrushMode === 'spray') {
                ctx.shadowBlur = 0;
                for (let i = 0; i < 20; i++) {
                    const offsetX = (Math.random() - 0.5) * currentBrushWidth * 3;
                    const offsetY = (Math.random() - 0.5) * currentBrushWidth * 3;
                    ctx.fillStyle = currentBrushColor;
                    ctx.fillRect(pos.x + offsetX, pos.y + offsetY, 2, 2);
                }
            } else if (currentBrushMode === 'rainbow') {
                const hue = (Date.now() / 10) % 360;
                ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`;
                ctx.shadowBlur = 5;
                ctx.shadowColor = ctx.strokeStyle;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (currentBrushMode === 'calligraphy') {
                ctx.strokeStyle = currentBrushColor;
                ctx.shadowBlur = 0;
                ctx.fillRect(pos.x, pos.y, currentBrushWidth * 2, currentBrushWidth / 2);
            } else if (currentBrushMode === 'stars') {
                ctx.font = `${currentBrushWidth * 3}px Arial`;
                ctx.fillText('✨', pos.x, pos.y);
            } else if (currentBrushMode === 'hearts') {
                ctx.font = `${currentBrushWidth * 3}px Arial`;
                ctx.fillText('💖', pos.x, pos.y);
            } else if (currentBrushMode === 'bubbles') {
                ctx.font = `${currentBrushWidth * 3}px Arial`;
                ctx.fillText('🫧', pos.x, pos.y);
            } else if (currentBrushMode === 'fire') {
                ctx.strokeStyle = '#ff3300';
                ctx.shadowColor = '#ffcc00';
                ctx.shadowBlur = 20;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (currentBrushMode === 'gold') {
                ctx.strokeStyle = '#ffd700';
                ctx.shadowColor = '#ffae00';
                ctx.shadowBlur = 12;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (currentBrushMode === 'shadow') {
                ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 10;
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            } else if (currentBrushMode === 'eraser') {
                ctx.clearRect(pos.x - currentBrushWidth/2, pos.y - currentBrushWidth/2, currentBrushWidth, currentBrushWidth);
            }
        }

        function addSticker(emoji) {
            ctx.font = '48px Arial';
            ctx.fillText(emoji, canvas.width / 2 - 24, canvas.height / 2);
        }

        function clearDrawingCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function downloadArtWithWatermark() {
            // Draw permanent watermark during download
            ctx.font = '900 16px Segoe UI, sans-serif';
            ctx.fillStyle = '#ffd700';
            ctx.fillText('CREATED BY: MALIK TAHIR NAZEER', 20, canvas.height - 20);

            const link = document.createElement('a');
            link.download = 'tahir-nazeer-drink-art.png';
            link.href = canvas.toDataURL();
            link.click();
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);
    </script>
</body>
