<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color" content="#ffffff">

    <title>Tahir Nazeer Game - Login</title>

    <link rel="icon"
          type="image/png"
          href="tn-game-icon.png">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(
                    145deg,
                    #ffffff 0%,
                    #f8fafc 52%,
                    #eef2f7 100%
                );
            color: #111827;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
        }

        .login-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 22px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            position: relative;

            padding: 34px 24px 27px;

            background:
                rgba(255,255,255,.88);

            border:
                1px solid
                rgba(15,23,42,.08);

            border-radius: 32px;

            box-shadow:
                0 30px 90px
                rgba(15,23,42,.11);

            backdrop-filter: blur(22px);

            text-align: center;

            overflow: hidden;
        }

        .login-card::before {
            content: "";

            position: absolute;

            width: 190px;
            height: 190px;

            border-radius: 50%;

            background:
                rgba(226,232,240,.45);

            top: -120px;
            right: -90px;
        }

        .login-photo-wrap {
            position: relative;
            z-index: 2;

            width: 118px;
            height: 118px;

            margin: 0 auto 20px;

            padding: 5px;

            border-radius: 50%;

            background: #ffffff;

            box-shadow:
                0 15px 40px
                rgba(15,23,42,.14);
        }

        .login-photo {
            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 50%;
        }

        .brand-label {
            position: relative;
            z-index: 2;

            color: #94a3b8;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: 2px;

            text-transform: uppercase;
        }

        .login-title {
            position: relative;
            z-index: 2;

            margin-top: 8px;

            font-size:
                clamp(27px, 8vw, 35px);

            font-weight: 950;

            letter-spacing: -1px;
        }

        .login-subtitle {
            position: relative;
            z-index: 2;

            margin-top: 7px;

            color: #64748b;

            font-size: 13px;

            line-height: 1.6;
        }

        .creator-name {
            color: #111827;
            font-weight: 900;
        }

        .form-area {
            position: relative;
            z-index: 2;

            margin-top: 28px;

            text-align: left;
        }

        .input-label {
            display: block;

            margin-bottom: 8px;

            color: #475569;

            font-size: 12px;

            font-weight: 800;
        }

        .name-input {
            width: 100%;

            height: 55px;

            padding: 0 17px;

            border:
                1px solid
                #e2e8f0;

            border-radius: 16px;

            outline: none;

            background: #f8fafc;

            color: #111827;

            font-size: 15px;

            transition:
                border-color .2s ease,
                background .2s ease,
                box-shadow .2s ease;
        }

        .name-input:focus {
            background: #ffffff;

            border-color: #334155;

            box-shadow:
                0 0 0 4px
                rgba(51,65,85,.08);
        }

        .name-input.error {
            border-color: #ef4444;

            animation:
                shake .3s ease;
        }

        @keyframes shake {

            0%,100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }

        }

        .error-message {
            min-height: 17px;

            margin-top: 6px;

            color: #ef4444;

            font-size: 11px;
        }

        .enter-button {
            width: 100%;

            height: 55px;

            margin-top: 5px;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #334155
                );

            color: #ffffff;

            font-size: 14px;

            font-weight: 900;

            letter-spacing: .5px;

            box-shadow:
                0 14px 30px
                rgba(15,23,42,.18);

            transition:
                transform .18s ease,
                opacity .18s ease;
        }

        .enter-button:active {
            transform: scale(.97);
        }

        .enter-button.loading {
            opacity: .7;

            pointer-events: none;
        }

        .login-info {
            position: relative;
            z-index: 2;

            margin-top: 20px;

            color: #94a3b8;

            font-size: 10px;

            line-height: 1.6;
        }

        .back-button {
            width: 100%;

            margin-top: 12px;

            padding: 12px;

            border-radius: 14px;

            background: #f1f5f9;

            color: #475569;

            font-size: 12px;

            font-weight: 800;
        }

        .copyright {
            margin-top: 18px;

            text-align: center;

            color: #94a3b8;

            font-size: 9px;

            line-height: 1.6;
        }

        /* Welcome overlay */

        #welcomeOverlay {
            position: fixed;
            inset: 0;

            z-index: 99999;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 25px;

            background:
                rgba(248,250,252,.96);

            backdrop-filter: blur(18px);
        }

        #welcomeOverlay.show {
            display: flex;
        }

        .welcome-box {
            width: 100%;
            max-width: 380px;

            padding: 35px 24px;

            border-radius: 28px;

            background: #ffffff;

            box-shadow:
                0 30px 90px
                rgba(15,23,42,.13);

            text-align: center;
        }

        .welcome-icon {
            width: 72px;
            height: 72px;

            margin: 0 auto 18px;

            border-radius: 22px;

            object-fit: cover;
        }

        .welcome-title {
            font-size: 25px;
            font-weight: 950;
        }

        .welcome-user {
            margin-top: 7px;

            color: #64748b;

            font-size: 13px;
        }

        .welcome-status {
            margin-top: 20px;

            color: #94a3b8;

            font-size: 11px;
        }

        .welcome-loader {
            width: 38px;
            height: 38px;

            margin: 18px auto 0;

            border-radius: 50%;

            border:
                4px solid #e2e8f0;

            border-top-color: #111827;

            animation:
                spin 1s linear infinite;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

    </style>
</head>

<body>

<div class="login-page">

    <div class="login-container">

        <div class="login-card">

            <!-- LOGIN IMAGE -->
            <div class="login-photo-wrap">

                <img
                    class="login-photo"
                    src="login-profile.jpg"
                    alt="Tahir Nazeer">

            </div>

            <div class="brand-label">
                TN Creative World
            </div>

            <h1 class="login-title">
                Enter The Game
            </h1>

            <p class="login-subtitle">
                Welcome to the creative world of
                <span class="creator-name">
                    Tahir Nazeer
                </span>
            </p>


            <!-- LOGIN FORM -->

            <div class="form-area">

                <label
                    class="input-label"
                    for="playerName">

                    Your Name

                </label>

                <input
                    id="playerName"
                    class="name-input"
                    type="text"
                    maxlength="30"
                    autocomplete="name"
                    spellcheck="false"
                    placeholder="Enter your name">

                <div
                    id="errorMessage"
                    class="error-message">
                </div>

                <button
                    id="enterButton"
                    class="enter-button"
                    type="button">

                    ENTER GAME

                </button>

                <button
                    class="back-button"
                    type="button"
                    onclick="goHome()">

                    ← Back to Home

                </button>

            </div>


            <div class="login-info">
                Your game profile will be saved on this device.
            </div>

        </div>


        <div class="copyright">

            Created & Developed by
            <strong>Tahir Nazeer</strong>

            <br>

            TN Creative World © 2026

        </div>

    </div>

</div>


<!-- WELCOME / LOADING OVERLAY -->

<div id="welcomeOverlay">

    <div class="welcome-box">

        <img
            class="welcome-icon"
            src="tn-game-icon.png"
            alt="TN Creative World">

        <div class="welcome-title">
            Welcome
        </div>

        <div
            id="welcomeUser"
            class="welcome-user">
        </div>

        <div
            id="welcomeStatus"
            class="welcome-status">

            Preparing your game...

        </div>

        <div class="welcome-loader"></div>

    </div>

</div>


<script>

"use strict";


/* =========================================
   PLAYER STORAGE
========================================= */

const TN_LOGIN_KEY =
    "TN_Player";


function savePlayer(name) {

    const player = {

        name: name,

        login: true,

        creator:
            "Tahir Nazeer",

        project:
            "TN Creative World",

        joined:
            new Date().toISOString()

    };


    localStorage.setItem(
        TN_LOGIN_KEY,
        JSON.stringify(player)
    );


    return player;
}


function getPlayer() {

    try {

        const data =
            localStorage.getItem(
                TN_LOGIN_KEY
            );

        if (!data) {
            return null;
        }

        return JSON.parse(data);

    } catch (error) {

        return null;

    }

}


/* =========================================
   WELCOME VOICE
========================================= */

function speakWelcome(name) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    window.speechSynthesis.cancel();


    const text =
        "Welcome to TN Creative World. Tahir Nazeer Project. Welcome " +
        name;


    const voice =
        new SpeechSynthesisUtterance(text);


    voice.rate = 0.92;

    voice.pitch = 1;

    voice.volume = 1;


    window.speechSynthesis.speak(
        voice
    );

}


/* =========================================
   INTRO SONG
========================================= */

function playIntroSong() {

    return new Promise(
        function(resolve) {

            const audio =
                new Audio(
                    "tahir-nazeer-game-intro.mp3"
                );


            audio.preload =
                "auto";


            audio.onended =
                function() {

                    resolve();

                };


            audio.onerror =
                function() {

                    /*
                     * If the audio file is not
                     * available yet, continue
                     * to the welcome system.
                     */

                    resolve();

                };


            const result =
                audio.play();


            if (
                result &&
                typeof result.catch
                === "function"
            ) {

                result.catch(
                    function() {

                        /*
                         * Browser playback
                         * protection.
                         */

                        resolve();

                    }
                );

            }

        }
    );

}


/* =========================================
   LOGIN PROCESS
========================================= */

async function enterGame() {

    const input =
        document.getElementById(
            "playerName"
        );

    const error =
        document.getElementById(
            "errorMessage"
        );

    const button =
        document.getElementById(
            "enterButton"
        );


    const name =
        input.value.trim();


    if (!name) {

        error.textContent =
            "Please enter your name.";

        input.classList.add(
            "error"
        );

        input.focus();

        return;

    }


    if (name.length < 2) {

        error.textContent =
            "Please enter at least 2 characters.";

        input.classList.add(
            "error"
        );

        input.focus();

        return;

    }


    error.textContent = "";

    input.classList.remove(
        "error"
    );


    button.classList.add(
        "loading"
    );

    button.textContent =
        "ENTERING...";


    const player =
        savePlayer(name);


    const overlay =
        document.getElementById(
            "welcomeOverlay"
        );


    const welcomeUser =
        document.getElementById(
            "welcomeUser"
        );


    const status =
        document.getElementById(
            "welcomeStatus"
        );


    welcomeUser.textContent =
        "Welcome " +
        player.name;


    overlay.classList.add(
        "show"
    );


    status.textContent =
        "Starting Tahir Nazeer Game...";


    /*
     * Start local intro song.
     * This click comes directly from
     * the user, so browsers are much
     * more likely to allow playback.
     */

    const musicPromise =
        playIntroSong();


    /*
     * Welcome voice follows the intro.
     */

    await musicPromise;


    status.textContent =
        "Welcome to TN Creative World";


    speakWelcome(
        player.name
    );


    /*
     * Give the welcome voice a moment,
     * then open the main game.
     */

    setTimeout(
        function() {

            window.location.href =
                "index.html";

        },
        1800
    );

}


/* =========================================
   HOME BUTTON
========================================= */

function goHome() {

    window.location.href =
        "index.html";

}


/* =========================================
   BUTTON
========================================= */

document
    .getElementById("enterButton")
    .addEventListener(
        "click",
        enterGame
    );


/* =========================================
   ENTER KEY
========================================= */

document
    .getElementById("playerName")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                enterGame();

            }

        }
    );


/* =========================================
   REMOVE ERROR WHILE TYPING
========================================= */

document
    .getElementById("playerName")
    .addEventListener(
        "input",
        function() {

            document
                .getElementById(
                    "errorMessage"
                )
                .textContent = "";

            this.classList.remove(
                "error"
            );

        }
    );


/* =========================================
   AUTO-FILL SAVED NAME
========================================= */

(function() {

    const player =
        getPlayer();

    if (
        player &&
        player.name
    ) {

        document
            .getElementById(
                "playerName"
            )
            .value =
            player.name;

    }

})();

</script>

</body>
</html>
