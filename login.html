<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#080b12">

<title>Tahir Nazeer Game — Login</title>

<link rel="icon"
      type="image/png"
      href="tn-game-icon.png">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#070a10;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;
}

/* ================================
   BACKGROUND
================================ */

.login-world{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(148,163,184,.12),
            transparent 30%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(71,85,105,.16),
            transparent 30%
        ),
        linear-gradient(
            145deg,
            #05070c,
            #0b1019 48%,
            #05070c
        );
}

/* animated light */

.light{
    position:absolute;
    width:260px;
    height:260px;
    border-radius:50%;
    background:rgba(255,255,255,.035);
    filter:blur(4px);
    animation:floatLight 7s ease-in-out infinite;
}

.light.one{
    top:-110px;
    left:-90px;
}

.light.two{
    right:-120px;
    bottom:-120px;
    animation-delay:2s;
}

@keyframes floatLight{

    0%,100%{
        transform:translate(0,0) scale(1);
    }

    50%{
        transform:translate(25px,-20px) scale(1.08);
    }

}

/* ================================
   CARD
================================ */

.login-card{
    position:relative;
    z-index:5;

    width:calc(100% - 32px);
    max-width:430px;

    padding:30px 22px 24px;

    border:1px solid
        rgba(255,255,255,.10);

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.09),
            rgba(255,255,255,.035)
        );

    backdrop-filter:blur(24px);

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.55);

    text-align:center;

    animation:
        cardIn .8s ease both;
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:
            translateY(30px)
            scale(.96);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }

}

/* ================================
   PROFILE PHOTO
================================ */

.photo-ring{
    width:112px;
    height:112px;

    margin:0 auto 18px;

    padding:4px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #fff,
            #64748b,
            #fff
        );

    box-shadow:
        0 0 0 1px
        rgba(255,255,255,.12),

        0 15px 45px
        rgba(0,0,0,.35);

    animation:
        photoPulse 3s ease-in-out infinite;
}

@keyframes photoPulse{

    0%,100%{
        box-shadow:
            0 0 0 1px
            rgba(255,255,255,.12),
            0 15px 45px
            rgba(0,0,0,.35);
    }

    50%{
        box-shadow:
            0 0 0 5px
            rgba(255,255,255,.04),
            0 18px 55px
            rgba(255,255,255,.10);
    }

}

.photo-ring img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
}

/* ================================
   BRAND
================================ */

.brand-mini{
    color:#94a3b8;

    font-size:9px;
    font-weight:900;

    letter-spacing:3px;

    text-transform:uppercase;
}

.title{
    margin-top:9px;

    font-size:
        clamp(28px,8vw,38px);

    font-weight:950;

    letter-spacing:-1.5px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #cbd5e1,
            #ffffff
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.creator{
    margin-top:8px;

    color:#94a3b8;

    font-size:12px;

    line-height:1.6;
}

.creator strong{
    color:#fff;
}

/* ================================
   GOOGLE LOGIN
================================ */

.login-area{
    margin-top:27px;
}

.google-button{
    width:100%;
    height:54px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:11px;

    border-radius:15px;

    background:#fff;
    color:#111827;

    font-size:13px;
    font-weight:900;

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.22);

    transition:
        transform .18s ease,
        opacity .18s ease;
}

.google-button:active{
    transform:scale(.97);
}

.google-logo{
    width:20px;
    height:20px;
    display:flex;
    align-items:center;
    justify-content:center;

    font-size:17px;
    font-weight:900;
}

/* ================================
   STATUS
================================ */

.status{
    min-height:18px;

    margin-top:12px;

    color:#94a3b8;

    font-size:10px;

    line-height:1.5;
}

.status.error{
    color:#f87171;
}

/* ================================
   FOOTER
================================ */

.login-footer{
    margin-top:23px;

    color:#64748b;

    font-size:9px;

    line-height:1.7;
}

.login-footer strong{
    color:#cbd5e1;
}

/* ================================
   LOADING
================================ */

.loading-screen{
    position:fixed;
    inset:0;

    z-index:9999;

    display:none;

    align-items:center;
    justify-content:center;

    background:
        rgba(5,7,12,.97);

    backdrop-filter:blur(18px);
}

.loading-screen.show{
    display:flex;
}

.loading-box{
    text-align:center;
}

.loading-icon{
    width:72px;
    height:72px;

    object-fit:cover;

    border-radius:20px;

    animation:
        loadingPulse 1.5s ease-in-out infinite;
}

@keyframes loadingPulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }

}

.loading-title{
    margin-top:18px;

    font-size:19px;
    font-weight:950;
}

.loading-text{
    margin-top:7px;

    color:#94a3b8;

    font-size:10px;
}

.loader{
    width:34px;
    height:34px;

    margin:18px auto 0;

    border-radius:50%;

    border:
        3px solid
        rgba(255,255,255,.12);

    border-top-color:#fff;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

</style>
</head>

<body>

<div class="login-world">

    <div class="light one"></div>
    <div class="light two"></div>


    <main class="login-card">

        <!--
            LOGIN PHOTO
            File:
            login-profile.jpg
        -->

        <div class="photo-ring">

            <img
                src="login-profile.jpg"
                alt="Tahir Nazeer">

        </div>


        <div class="brand-mini">
            TN CREATIVE WORLD
        </div>


        <h1 class="title">
            TAHIR NAZEER
        </h1>


        <p class="creator">
            Created &amp; Developed by
            <strong>Tahir Nazeer</strong>
        </p>


        <section class="login-area">

            <!--
                GOOGLE LOGIN

                Real Google authentication
                will be connected here.
            -->

            <button
                id="googleLogin"
                class="google-button"
                type="button">

                <span class="google-logo">
                    G
                </span>

                <span>
                    Continue with Google
                </span>

            </button>


            <div
                id="loginStatus"
                class="status">

                Sign in with your Google account
                to enter the game.

            </div>

        </section>


        <footer class="login-footer">

            Your player profile will be connected
            to your Google account.

            <br>

            <strong>
                Tahir Nazeer Game © 2026
            </strong>

        </footer>

    </main>

</div>


<!-- ================================
     LOADING SCREEN
================================ -->

<div
    id="loadingScreen"
    class="loading-screen">

    <div class="loading-box">

        <img
            src="tn-game-icon.png"
            class="loading-icon"
            alt="Tahir Nazeer Game">

        <div class="loading-title">
            Welcome to TN Creative World
        </div>

        <div
            id="loadingText"
            class="loading-text">

            Preparing your game...

        </div>

        <div class="loader"></div>

    </div>

</div>


<script>

/* ==========================================
   TAHIR NAZEER GAME
   LOGIN CONTROLLER
========================================== */

"use strict";


const PLAYER_KEY =
    "TN_Player";


/*
    Google authentication کا اصل Client ID
    بعد میں یہاں configuration میں آئے گا۔

    IMPORTANT:
    Client Secret یہاں نہیں ڈالنا۔
*/

const GOOGLE_CLIENT_ID =
    "";


/* ==========================================
   STORAGE
========================================== */

function savePlayer(player){

    localStorage.setItem(
        PLAYER_KEY,
        JSON.stringify(player)
    );

}


function getPlayer(){

    try{

        const raw =
            localStorage.getItem(
                PLAYER_KEY
            );

        if(!raw){
            return null;
        }

        return JSON.parse(raw);

    }catch(error){

        return null;

    }

}


/* ==========================================
   SHOW LOADING
========================================== */

function showLoading(name){

    const screen =
        document.getElementById(
            "loadingScreen"
        );

    const text =
        document.getElementById(
            "loadingText"
        );

    text.textContent =
        "Welcome " +
        name +
        " — starting your game...";

    screen.classList.add(
        "show"
    );

}


/* ==========================================
   GAME ENTRY
========================================== */

function enterGame(player){

    savePlayer({

        name:
            player.name,

        email:
            player.email || "",

        picture:
            player.picture || "",

        login:
            true,

        provider:
            "google",

        creator:
            "Tahir Nazeer",

        project:
            "TN Creative World",

        joined:
            new Date().toISOString()

    });


    showLoading(
        player.name
    );


    /*
       IMPORTANT:
       Intro song کو browser autoplay
       protection کی وجہ سے login click
       کے بعد شروع کرنا زیادہ reliable ہے۔
    */

    const audio =
        new Audio(
            "tahir-nazeer-game-intro.mp3"
        );

    audio.preload = "auto";


    audio.play()
        .catch(function(){

            /*
              اگر browser نے audio روک دیا
              تو game پھر بھی بند نہیں ہوگا۔
            */

        });


    /*
       Main Game Page
    */

    setTimeout(
        function(){

            window.location.href =
                "index.html";

        },
        900
    );

}


/* ==========================================
   GOOGLE BUTTON
========================================== */

document
    .getElementById(
        "googleLogin"
    )
    .addEventListener(
        "click",
        function(){

            const status =
                document.getElementById(
                    "loginStatus"
                );


            /*
              Client ID ابھی configure نہیں۔
            */

            if(!GOOGLE_CLIENT_ID){

                status.className =
                    "status error";

                status.textContent =
                    "Google Login ابھی configure نہیں ہوا۔ Google Client ID لگانے کے بعد یہ بٹن اصل Gmail Login کرے گا۔";

                return;

            }

            /*
              یہاں Google Identity Services
              initialization آئے گی۔
            */

        }
    );


/* ==========================================
   ALREADY LOGGED IN
========================================== */

(function(){

    const player =
        getPlayer();

    /*
       ابھی automatic redirect نہیں کر رہے،
       تاکہ user Login screen دوبارہ دیکھ
       سکے اور system debugging آسان رہے۔
    */

})();

</script>

</body>
</html>
