<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOGIN | TAHIR NAZEER GAME</title>
    
    <!-- Game Icon -->
    <link rel="icon" type="image/png" href="./tn-game-icon.png">
    
    <!-- Existing CSS System -->
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./brand.css">
    <link rel="stylesheet" href="./splash.css">

    <style>
        :root {
            --bg-dark: #030308;
            --card-bg: rgba(12, 12, 25, 0.88);
            --primary-gold: #ffd700;
            --accent-cyan: #00f0ff;
            --accent-purple: #8a2be2;
            --accent-neon: #ff0055;
            --text-light: #ffffff;
            --border-glow: rgba(0, 240, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #101026 0%, #020205 100%);
            padding: 15px;
            overflow-x: hidden;
        }

        /* Hollywood Game Login Container */
        .login-card {
            background: var(--card-bg);
            border: 2px solid var(--border-glow);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.25), inset 0 0 20px rgba(138, 43, 226, 0.3);
            backdrop-filter: blur(20px);
            position: relative;
            animation: cardAppear 1s ease-out;
        }

        .login-header-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-gold);
            box-shadow: 0 0 25px var(--primary-gold);
            margin-bottom: 15px;
        }

        .brand-title {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff 0%, var(--primary-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .brand-sub {
            font-size: 0.95rem;
            color: var(--accent-cyan);
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 0 0 10px var(--accent-cyan);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-label {
            display: block;
            font-size: 0.85rem;
            color: var(--primary-gold);
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .login-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .login-input:focus {
            border-color: var(--primary-gold);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .btn-enter-game {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, var(--accent-neon), var(--accent-purple), var(--accent-cyan));
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 0 25px var(--accent-neon);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .btn-enter-game:hover, .btn-enter-game:active {
            transform: scale(1.03);
            box-shadow: 0 0 40px var(--accent-cyan);
        }

        /* Audio Status Bar in Login */
        .login-audio-status {
            margin-top: 20px;
            padding: 12px;
            background: rgba(0, 240, 255, 0.08);
            border-radius: 10px;
            border: 1px solid var(--border-glow);
            font-size: 0.85rem;
            color: var(--accent-cyan);
            display: none;
        }

        .login-footer {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #777;
        }

        .login-footer span {
            color: var(--primary-gold);
            font-weight: bold;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Login Profile Photo (login-profile.jpg) -->
        <img src="./login-profile.jpg" alt="Tahir Nazeer Login Profile" class="login-header-img" onerror="this.src='./profile.jpg'">
        
        <h1 class="brand-title">MALIK TAHIR NAZEER</h1>
        <p class="brand-sub">TN CREATIVE WORLD</p>

        <form id="gameLoginForm" onsubmit="handleLoginSubmit(event)">
            <div class="input-group">
                <label class="input-label">PLAYER / GAMER NAME</label>
                <input type="text" id="playerNameInput" class="login-input" placeholder="اپنا نام لکھیں..." required>
            </div>

            <button type="submit" class="btn-enter-game">
                ENTER GAME & PLAY MUSIC 🎮
            </button>
        </form>

        <div id="audioStatusBox" class="login-audio-status">
            <div id="statusText">🎵 Starting 1m 49s Intro Song...</div>
        </div>

        <div class="login-footer">
            Created & Developed by <span>MALIK TAHIR NAZEER</span>
        </div>
    </div>

    <!-- Hidden Audio Player for 1m 49s Original Intro Song -->
    <audio id="introAudioPlayer" src="./tahir-nazeer-game-intro.mp3" preload="auto"></audio>

    <!-- Hidden YouTube Player for 5 Songs Sequential Auto-Play -->
    <div id="ytContainer" style="display:none;"><div id="ytPlayer"></div></div>

    <!-- YouTube API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <!-- Existing JS System Libraries -->
    <script src="./brand.js"></script>
    <script src="./loginSystem.js"></script>
    <script src="./loginPage.js"></script>

    <script>
        let currentYtIndex = 0;
        let ytPlayerObj = null;
        let isYtReady = false;

        const youtubeSongs = [
            'REmRBK6YdSo',
            'jn0V1JBxNGU',
            '68ZEOOvEcds',
            'pThESjSD5TM',
            'pi_E8CyAWXA'
        ];

        // Auto Load saved player name if available
        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('tn_player_name');
            if (savedName) {
                document.getElementById('playerNameInput').value = savedName;
            }
        });

        // Form Submit & Login Sequence Control
        function handleLoginSubmit(e) {
            e.preventDefault();
            const playerName = document.getElementById('playerNameInput').value.trim() || 'Malik Tahir Nazeer Guest';
            
            // Local Session Saving
            localStorage.setItem('tn_player_name', playerName);
            localStorage.setItem('tn_is_logged_in', 'true');

            // Show Audio Control Status
            const audioStatusBox = document.getElementById('audioStatusBox');
            audioStatusBox.style.display = 'block';

            // Step 1: Start 1m 49s Intro Song
            playFullIntroSong(playerName);
        }

        // Play Full 1m 49s Intro Audio
        function playFullIntroSong(playerName) {
            const audio = document.getElementById('introAudioPlayer');
            const statusText = document.getElementById('statusText');

            statusText.innerText = '🎵 Playing Intro Song (1m 49s)...';

            audio.play().then(() => {
                // When 1m 49s Song completes fully
                audio.onended = () => {
                    playWelcomeVoiceAI(playerName);
                };
            }).catch(err => {
                console.log('Audio autoplay blocked, triggering AI voice:', err);
                playWelcomeVoiceAI(playerName);
            });
        }

        // Step 2: AI Welcome Voice
        function playWelcomeVoiceAI(playerName) {
            const statusText = document.getElementById('statusText');
            statusText.innerText = '🎙️ Speaking Welcome Voice...';

            if ('speechSynthesis' in window) {
                const welcomeUtterance = new SpeechSynthesisUtterance(`طاہر نذیر گیم میں آپ کا ویلکم ہے ${playerName}`);
                welcomeUtterance.lang = 'ur-PK';
                welcomeUtterance.rate = 0.85;

                welcomeUtterance.onend = () => {
                    startYouTubeAutoPlay();
                };

                window.speechSynthesis.speak(welcomeUtterance);
            } else {
                startYouTubeAutoPlay();
            }
        }

        // Step 3: YouTube Player Sequential Auto Play
        function onYouTubeIframeAPIReady() {
            ytPlayerObj = new YT.Player('ytPlayer', {
                height: '0',
                width: '0',
                videoId: youtubeSongs[0],
                events: {
                    'onReady': () => { isYtReady = true; },
                    'onStateChange': onYtStateChange
                }
            });
        }

        function startYouTubeAutoPlay() {
            const statusText = document.getElementById('statusText');
            statusText.innerText = '🎵 YouTube Auto-Play Playlist Starting... Redirecting to Home...';

            currentYtIndex = 0;
            playYtTrackByIndex(currentYtIndex);

            // Redirect to Home page after login session start
            setTimeout(() => {
                window.location.href = './index.html';
            }, 1500);
        }

        function playYtTrackByIndex(index) {
            if (index < youtubeSongs.length && ytPlayerObj && isYtReady) {
                ytPlayerObj.loadVideoById(youtubeSongs[index]);
                ytPlayerObj.playVideo();
            }
        }

        function onYtStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                currentYtIndex++;
                if (currentYtIndex < youtubeSongs.length) {
                    playYtTrackByIndex(currentYtIndex);
                }
            }
        }
    </script>
</body>
</html>
